name: FestiveGuest E2E

on:
  workflow_dispatch: {}
  schedule:
    # Every day at 03:00 UTC
    - cron: '0 3 * * *'

defaults:
  run:
    working-directory: e2e

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: https://www.festiveguest.com
          # Uncomment once a dedicated test account exists and its
          # credentials are stored as repo/organization secrets:
          # FG_TEST_EMAIL: ${{ secrets.FG_TEST_EMAIL }}
          # FG_TEST_PASSWORD: ${{ secrets.FG_TEST_PASSWORD }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
