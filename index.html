<!doctype html>
<html lang="en" class="boot-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF6B35" />
    <style>
      html { background: #FFF6EE; }
      html.boot-dark:not(:has(.app-container)) { background: #120a1f; }
      /* The start-up loader: the animated emblem (handshake, "f g", the ring filling) and the name.
         It plays at least one full round on every visit; main.jsx fades it out once the app is up. */
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 0.9rem; background: radial-gradient(ellipse at 50% 40%, #2b1a46 0%, #120a1f 70%); pointer-events: none; }
      #boot p { margin: 0; font: 800 1.6rem/1 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: -0.02em; }
      #boot p span:first-child { color: #ff9a4d; } #boot p span + span { color: #86d957; }
      /* the app draws itself at 75% on desktop; keep the loader the same size while it fades out over it */
      @media (min-width: 1001px) { html:has(.app-container) #boot { zoom: 1.3333; } }
      #boot small { display: block; margin-top: 0.35rem; font: 600 0.8rem system-ui, sans-serif; letter-spacing: 0.04em; text-align: center; color: rgba(255, 240, 230, 0.55); }
    </style>
    <meta name="google-site-verification" content="3xFFZ4Awq7hg34u3LsRO1VyFmbnxzBZ95mLtA0_x22s" />

    <title>FestiveGuest - Find a Trusted Local Host Across India</title>
    <meta name="description" content="A community network for interviews, hospital visits, job joining, exams, festivals, and life transitions — not tourism. Connect with a trusted local host anywhere in India." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.festiveguest.com/" />

    <!-- Open Graph / Facebook / WhatsApp link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FestiveGuest" />
    <meta property="og:title" content="FestiveGuest - Find a Trusted Local Host Across India" />
    <meta property="og:description" content="A community network for interviews, hospital visits, job joining, exams, festivals, and life transitions — not tourism." />
    <meta property="og:url" content="https://www.festiveguest.com/" />
    <meta property="og:image" content="https://www.festiveguest.com/assets/logo.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FestiveGuest - Find a Trusted Local Host Across India" />
    <meta name="twitter:description" content="A community network for interviews, hospital visits, job joining, exams, festivals, and life transitions — not tourism." />
    <meta name="twitter:image" content="https://www.festiveguest.com/assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

      "@context": "https://schema.org",

    }
    </script>
  </head>

    <div id="boot" aria-hidden="true"><img src="/assets/loader.svg" alt="" width="150" height="150" /><p><span>Festive</span><span>Guest</span><small>Find a Local Host</small></p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
