<!doctype html>
<html lang="en" class="boot-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF6B35" />
    <style>
      html { background: #FFF6EE; }
      html.boot-dark:not(:has(.app-container)) { background: #120a1f; }
      /* Only appears if the app is slow to start; React replaces it on mount. */
      .boot-spinner {
        position: fixed; top: 50%; left: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px;
        border-radius: 50%; border: 3px solid rgba(160, 136, 122, 0.25); border-top-color: #FF6B35;
        opacity: 0; animation: boot-spin 0.8s linear infinite, boot-in 0.3s ease 0.8s forwards;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-in { to { opacity: 1; } }
    </style>
    <meta name="google-site-verification" content="3xFFZ4Awq7hg34u3LsRO1VyFmbnxzBZ95mLtA0_x22s" />

    <title>FestiveGuest - Find a Trusted Local Host Across India</title>
    <meta name="description" content="A community network for interviews, hospital visits, job joining, exams, festivals, and life transitions — not tourism. Connect with a trusted local host anywhere in India." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.festiveguest.com/" />

    <!-- Open Graph / Facebook / WhatsApp link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FestiveGuest" />
    <meta property="og:title" content="FestiveGuest - Find a Trusted Local Host Across India" />
    <meta property="og:description" content="A community network for interviews, hospital visits, job joining, exams, festivals, and life transitions — not tourism." />
    <meta property="og:url" content="https://www.festiveguest.com/" />
    <meta property="og:image" content="https://www.festiveguest.com/assets/logo.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FestiveGuest - Find a Trusted Local Host Across India" />
    <meta name="twitter:description" content="A community network for interviews, hospital visits, job joining, exams, festivals, and life transitions — not tourism." />
    <meta name="twitter:image" content="https://www.festiveguest.com/assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  </head>
